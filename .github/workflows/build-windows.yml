name: Build eseguibile Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # necessario per allegare l'exe alla Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze
        run: pip install -r requirements.txt pyinstaller

      - name: Self-test numerico
        run: python rsl_core.py --selftest

      - name: Compila con PyInstaller
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name RSL_FFT
          --hidden-import matplotlib.backends.backend_tkagg --hidden-import PIL._tkinter_finder rsl_fft_gui.py

      - name: Smoke test dell'exe (avvio e chiusura)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\RSL_FFT.exe -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test fallito (exit code $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: RSL_FFT-windows
          path: dist/RSL_FFT.exe

      - name: Pubblica nella Release (solo per i tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RSL_FFT.exe
